name: shipping_user_app
description: "Shipping Supervisor App Project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

flutter_intl:
  enabled: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management.
  flutter_bloc: ^9.0.0
  # Code generator (mainly used with cubit and retrofit).
  freezed: ^2.5.8
  freezed_annotation: ^2.4.4
  # Dependency injection.
  get_it: ^8.0.3
  # Automatically generate code to and from json.
  json_serializable: ^6.9.3
  json_annotation: ^4.9.0
  # Networking.
  dio: ^5.7.0
  retrofit: ^4.4.2
  retrofit_generator: ^9.1.7
  pretty_dio_logger: ^1.4.0
  # Flutter plugin for reading and writing simple key-value pairs locally.
  shared_preferences: ^2.4.0
  # Flutter Secure Storage provides API to store data in secure storage.
  flutter_secure_storage: ^9.2.4
  # For adapting screens and font size.
  flutter_screenutil: ^5.9.3
  # Allow for asynchronous and synchronous formatting of phone numbers
  flutter_libphonenumber: ^2.5.0
  # An SVG rendering.
  flutter_svg: ^2.0.10+1
  # Flutter library to load and cache network images. Can also be used with placeholder and error widgets.
  cached_network_image: ^3.4.1
  # A package provides an easy way to add shimmer effect.
  skeletonizer: ^1.4.3
  # A declarative router
  go_router: ^14.7.1
  # Flutter plugin for querying information about the application package.
  package_info_plus: ^8.1.3
  # Handle permissions.
  permission_handler: ^11.3.1
  # Cross-platform plugin for easy access to device's location in real-time.
  location: ^8.0.0
  # This plugin provides a cross-platform (iOS, Android) API for generic location (GPS etc.) functions.
  geolocator: ^13.0.2
  # APIs for parsing and manipulating HTML content outside the browser.
  flutter_widget_from_html: ^0.15.3
  # A Dart package that helps to implement value based equality without needing to explicitly override == and hashCode.
  equatable: ^2.0.7
  # A Flutter ListView where the list items can be grouped into sections.
  grouped_list: ^6.0.0
  # Flutter plugin for selecting images from the Android and iOS image library.
  image_picker: ^1.1.2
  # Flutter integration for Supabase. This package makes it simple for developers to build secure and scalable products.
  supabase_flutter: ^2.8.3
  # Easily configure any flutter application with global variables using a `.env` file.
  flutter_dotenv: ^5.2.1
  # A versatile mapping package for Flutter, that's simple and easy to learn, yet completely customizable and configurable.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.10.0
  widget_to_marker: ^1.0.6
  # internationalized/localized messages, date and number formatting and parsing, bi-directional text.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # A build system for Dart code generation and modular compilation.
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/icons/

  fonts:
      - family: CustomAppIcons
        fonts:
          - asset: assets/icons/CustomAppIcons.ttf

      - family: Cairo
        fonts:
          - asset: assets/fonts/cairo/Cairo-100.ttf
            weight: 100
          - asset: assets/fonts/cairo/Cairo-200.ttf
            weight: 200
          - asset: assets/fonts/cairo/Cairo-300.ttf
            weight: 300
          - asset: assets/fonts/cairo/Cairo-400.ttf
            weight: 400
          - asset: assets/fonts/cairo/Cairo-500.ttf
            weight: 500
          - asset: assets/fonts/cairo/Cairo-600.ttf
            weight: 600
          - asset: assets/fonts/cairo/Cairo-700.ttf
            weight: 700
          - asset: assets/fonts/cairo/Cairo-800.ttf
            weight: 800
          - asset: assets/fonts/cairo/Cairo-900.ttf
            weight: 900